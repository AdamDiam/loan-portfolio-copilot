  question: What is our NPE ratio by product type?

- id: r16
  route: both
  question: How many of our active loans are forborne, and how long must the probation period last according to the guidelines?

- id: r17
  route: both
  question: What is our NPE ratio, and what do the EBA guidelines require from banks above the NPE strategy threshold?

